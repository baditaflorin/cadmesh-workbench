services:
  app:
    image: ghcr.io/baditaflorin/cadmesh-workbench:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CADMESH_ADDR: ":8080"
      CADMESH_DATA_DIR: /data
      CADMESH_ALLOWED_ORIGINS: "https://baditaflorin.github.io,https://baditaflorin.github.io/cadmesh-workbench"
    volumes:
      - cadmesh-data:/data
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "/app/server", "healthcheck" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8g

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "25342:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles:
      - observability
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - internal

volumes:
  cadmesh-data:
  prometheus-data:

networks:
  internal:
    driver: bridge
